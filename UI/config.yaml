# Settings for hri_ui.py

# Participant window fills the whole screen.
fullscreen: true

# Left edge (in pixels) of the participant monitor in the desktop layout.
# 0 = main monitor. Example: 1920 if the participant monitor is to the right of a 1920 px wide main monitor.
participant_monitor_x_offset: 0

# Fake robot delays in seconds (only used with --dry-run).
fake_robot:
  pick: 3.0
  place_decision: 3.0
  point: 3.0
  home: 3.0

# Session structure, in this order. Ids must match the level column in sequences.csv and
# the keys in statements.json. reading_time_s: time on the statements screen, with a
# countdown, then the level starts by itself (Enter starts earlier); null = no limit.
# The practice round is skipped if sequences.csv has no practice rows for the participant.
levels:
  practice: {label: "Practice round", questions: 3, reading_time_s: null}   # 3 statements
  easy:     {label: "Level 1",        questions: 6, reading_time_s: 40}     # 4 statements
  hard:     {label: "Level 2",        questions: 6, reading_time_s: 20}     # 4 statements, same difficulty

font_family: Quicksand   # rounded friendly font (installed); Helvetica if missing
font_sizes:
  title: 48
  text: 40
  statements: 32
  counter: 28
  hint: 18
  experimenter: 13

# Placeholder. The group writes the final debrief text.
debrief_text: |
  Thank you for taking part.

# Friendly look: progress dots, advice icons (same gray bowl or robot drawing for both
# sources), moving robot while the robot works, fade-in of each screen. false = plain text.
animations: true
fade_ms: 250
